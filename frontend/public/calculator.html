<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Glitch - Calculadora</title>
    <link rel="icon" href="https://res.cloudinary.com/dzhp64paw/image/upload/v1769010837/1_btdbv9.png" />

    <!-- Nothing OS Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;500;600;700&family=VT323&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        /* ================================================
           NOTHING OS DESIGN SYSTEM
           Industrial • Raw • Dark • Minimal
           ================================================ */

        :root {
            /* Nothing Color Palette */
            --nothing-black: #0d0d0d;
            --nothing-dark: #111111;
            --nothing-surface: #1a1a1a;
            --nothing-border: #333333;
            --nothing-border-light: #444444;
            --nothing-text: #ffffff;
            --nothing-text-dim: #888888;
            --nothing-text-muted: #555555;
            --nothing-red: #D71921;
            --nothing-red-dim: rgba(215, 25, 33, 0.3);

            /* Typography */
            --font-mono: 'Roboto Mono', monospace;
            --font-dot: 'VT323', monospace;

            /* Spacing */
            --radius-sm: 4px;
            --radius-md: 8px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            outline: none;
        }

        /* Dot Grid Background Pattern */
        body {
            font-family: var(--font-mono);
            background-color: var(--nothing-black);
            background-image:
                radial-gradient(circle, #222 1px, transparent 1px);
            background-size: 20px 20px;
            color: var(--nothing-text);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        /* Main Container - Industrial Panel */
        .card {
            background-color: var(--nothing-dark);
            border: 1px solid var(--nothing-border);
            border-radius: var(--radius-md);
            width: 100%;
            max-width: 920px;
            padding: 24px 32px;
            position: relative;
        }

        /* Decorative Corner Elements */
        .card::before {
            content: '';
            position: absolute;
            top: 8px;
            left: 16px;
            font-family: var(--font-mono);
            font-size: 9px;
            color: var(--nothing-text-muted);
            letter-spacing: 1px;
        }

        .card::after {
            content: '●';
            position: absolute;
            top: 8px;
            right: 16px;
            font-size: 10px;
            color: var(--nothing-red);
            animation: blink 2s infinite;
        }

        @keyframes blink {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: 0.3;
            }
        }

        /* Two Column Layout */
        .main-content {
            display: grid;
            grid-template-columns: 1fr 280px;
            gap: 32px;
            align-items: flex-start;
            margin-top: 16px;
        }

        .column-left {
            display: flex;
            flex-direction: column;
        }

        .column-right {
            position: sticky;
            top: 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        /* Header */
        .card-header {
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 16px;
            border-bottom: 1px solid var(--nothing-border);
        }

        .back-link {
            color: var(--nothing-text-dim);
            text-decoration: none;
            font-size: 12px;
            display: flex;
            align-items: center;
            gap: 4px;
            transition: color 0.2s ease;
        }

        .back-link:hover {
            color: var(--nothing-text);
        }

        .header-title {
            font-family: var(--font-dot);
            font-size: 24px;
            letter-spacing: 4px;
            color: var(--nothing-text);
        }

        .header-logo {
            max-width: 180px;
            height: auto;
            display: block;
            filter: brightness(0) invert(1);
            opacity: 0.9;
        }

        /* Tabs - Nothing Style */
        .tabs-container {
            display: flex;
            background-color: transparent;
            border: 1px solid var(--nothing-border);
            border-radius: var(--radius-sm);
            margin-bottom: 24px;
            overflow: hidden;
        }

        .tab-btn {
            flex: 1;
            padding: 16px 20px;
            border: none;
            background: transparent;
            color: var(--nothing-text-dim);
            font-weight: 500;
            cursor: pointer;
            transition: all 0.15s ease;
            font-family: var(--font-mono);
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 1px;
            position: relative;
        }

        .tab-btn:first-child {
            border-right: 1px solid var(--nothing-border);
        }

        .tab-btn:hover {
            color: var(--nothing-text);
            background-color: var(--nothing-surface);
        }

        .tab-btn.active {
            background-color: var(--nothing-text);
            color: var(--nothing-black);
        }

        /* Inputs Grid */
        .inputs-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 24px;
            margin-bottom: 24px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
        }

        .input-group.full-width {
            grid-column: 1 / -1;
        }

        .label-row {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin-bottom: 8px;
        }

        .input-label {
            font-size: 12px;
            font-weight: 600;
            color: var(--nothing-text-dim);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        /* Terminal-Style Inputs */
        .form-input {
            width: 100%;
            padding: 14px 0;
            padding-right: 32px;
            font-size: 18px;
            font-family: var(--font-mono);
            color: var(--nothing-text);
            border: none;
            border-bottom: 1px solid var(--nothing-border);
            border-radius: 0;
            background-color: transparent;
            transition: all 0.2s ease;
            appearance: none;
            -moz-appearance: textfield;
        }

        .form-input::-webkit-outer-spin-button,
        .form-input::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }

        .form-input::placeholder {
            color: var(--nothing-text-muted);
        }

        .form-input:focus {
            border-bottom-color: var(--nothing-red);
        }

        .form-input.error {
            border-bottom-color: var(--nothing-red);
            background-color: var(--nothing-red-dim);
        }

        .input-icon {
            position: absolute;
            right: 0;
            color: var(--nothing-text-muted);
            font-size: 14px;
            pointer-events: none;
        }

        /* Error Message */
        .input-error-msg {
            color: var(--nothing-red);
            font-size: 10px;
            margin-top: 6px;
            display: none;
            font-family: var(--font-mono);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .input-group.error-state .input-error-msg {
            display: block;
        }

        /* ADD Button - Wireframe Style */
        .add-row {
            margin-bottom: 24px;
        }

        .btn-add {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 16px;
            border: 1px dashed var(--nothing-border-light);
            border-radius: var(--radius-sm);
            background-color: transparent;
            color: var(--nothing-text-dim);
            font-weight: 500;
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            transition: all 0.15s ease;
            font-family: var(--font-mono);
        }

        .btn-add:hover {
            border-color: var(--nothing-text);
            color: var(--nothing-text);
            background-color: var(--nothing-surface);
        }

        /* Items List - Console Log Style */
        .items-list {
            margin-bottom: 24px;
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .list-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 16px;
            background-color: var(--nothing-surface);
            border-left: 2px solid var(--nothing-border);
            font-size: 12px;
            animation: slideIn 0.2s ease forwards;
            font-family: var(--font-mono);
        }

        .list-item:hover {
            border-left-color: var(--nothing-red);
        }

        .item-info {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .item-title {
            font-weight: 400;
            color: var(--nothing-text);
            font-size: 14px;
        }

        .item-title strong {
            color: var(--nothing-text);
            font-weight: 600;
        }

        .item-dims {
            font-size: 12px;
            color: var(--nothing-text-muted);
            font-family: var(--font-mono);
        }

        .btn-delete-item {
            background: none;
            border: 1px solid transparent;
            color: var(--nothing-text-muted);
            cursor: pointer;
            padding: 6px 8px;
            border-radius: var(--radius-sm);
            transition: all 0.15s ease;
            font-size: 12px;
        }

        .btn-delete-item:hover {
            border-color: var(--nothing-red);
            color: var(--nothing-red);
            background-color: var(--nothing-red-dim);
        }

        /* Calculate Button - Primary Action */
        .buttons-row {
            display: flex;
        }

        .btn {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            padding: 18px;
            border-radius: var(--radius-sm);
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.15s ease;
            font-family: var(--font-dot);
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .btn-primary {
            background-color: var(--nothing-text);
            color: var(--nothing-black);
            border: 1px solid var(--nothing-text);
        }

        .btn-primary:hover {
            background-color: transparent;
            color: var(--nothing-text);
        }

        /* Result Section - Dot Matrix Display */
        .result-container {
            padding: 24px 20px;
            background-color: var(--nothing-surface);
            border: 1px solid var(--nothing-border);
            border-radius: var(--radius-sm);
            text-align: center;
            display: block;
            opacity: 1;
            position: relative;
        }

        .result-container::before {
            content: '';
            position: absolute;
            top: 8px;
            left: 8px;
            right: 8px;
            height: 2px;
            background: linear-gradient(90deg,
                    var(--nothing-border) 0%,
                    var(--nothing-red) 50%,
                    var(--nothing-border) 100%);
            opacity: 0.5;
        }

        .result-container.show {
            animation: fadeIn 0.3s ease forwards;
        }

        .result-label {
            font-size: 11px;
            color: var(--nothing-text-muted);
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: 500;
            font-family: var(--font-mono);
        }

        .result-value {
            font-size: 52px;
            font-weight: 400;
            color: var(--nothing-text);
            font-family: var(--font-dot);
            letter-spacing: 4px;
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.15);
        }

        /* Footer */
        .card-footer {
            margin-top: 16px;
            text-align: center;
        }

        .btn-clear {
            background: none;
            border: 1px solid transparent;
            color: var(--nothing-text-muted);
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            transition: all 0.15s ease;
            font-family: var(--font-mono);
            padding: 8px 16px;
            border-radius: var(--radius-sm);
        }

        .btn-clear:hover {
            color: var(--nothing-red);
            border-color: var(--nothing-red);
        }

        /* Auto Calculate Toggle */
        .auto-calc-toggle {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            cursor: pointer;
            user-select: none;
            padding: 8px;
        }

        .auto-calc-toggle input[type="checkbox"] {
            display: none;
        }

        .toggle-checkbox {
            width: 18px;
            height: 18px;
            border-radius: 50%;
            border: 1px solid var(--nothing-border);
            background-color: transparent;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
        }

        .toggle-checkbox i {
            color: var(--nothing-black);
            font-size: 9px;
            opacity: 0;
            transition: opacity 0.15s ease;
        }

        .auto-calc-toggle input[type="checkbox"]:checked+.toggle-checkbox {
            background-color: var(--nothing-text);
            border-color: var(--nothing-text);
        }

        .auto-calc-toggle input[type="checkbox"]:checked+.toggle-checkbox i {
            opacity: 1;
        }

        .toggle-label {
            font-size: 10px;
            font-weight: 500;
            color: var(--nothing-text-dim);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* Animations */
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(5px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateX(-10px);
            }

            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        /* Decorative Scan Line Effect */
        .card::before {
            pointer-events: none;
        }

        /* Responsive */
        @media (max-width: 800px) {
            .main-content {
                grid-template-columns: 1fr;
                gap: 24px;
            }

            .column-right {
                position: static;
                order: 1;
            }

            .column-left {
                order: 0;
            }
        }

        @media (max-width: 600px) {
            .card {
                padding: 20px 16px;
            }

            .inputs-grid {
                grid-template-columns: 1fr;
                gap: 16px;
            }

            .result-value {
                font-size: 36px;
            }
        }
    </style>
</head>

<body>

    <div class="card">
        <!-- Header -->
        <div class="card-header">
            <a href="/" class="back-link">
                <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg>
                Volver
            </a>
            <span class="header-title">CALCULADORA</span>
            <span style="width: 60px;"></span>
        </div>

        <!-- Two Column Layout -->
        <div class="main-content">
            <!-- Left Column: Data & List -->
            <div class="column-left">
                <!-- Tabs -->
                <div class="tabs-container">
                    <button class="tab-btn active" id="tab-area">Área (m²)</button>
                    <button class="tab-btn" id="tab-volume">Volumen (m³)</button>
                </div>

                <!-- Inputs -->
                <div class="inputs-grid">
                    <!-- Largo -->
                    <div class="input-group">
                        <div class="label-row">
                            <label class="input-label" for="largo">Largo (m)</label>
                        </div>
                        <div class="input-wrapper">
                            <input type="number" id="largo" class="form-input" placeholder="0.00" min="0" step="0.01">
                            <i class="fa-solid fa-ruler-horizontal input-icon"></i>
                        </div>
                        <div class="input-error-msg">Dato requerido</div>
                    </div>

                    <!-- Ancho -->
                    <div class="input-group">
                        <div class="label-row">
                            <label class="input-label" for="ancho">Ancho (m)</label>
                        </div>
                        <div class="input-wrapper">
                            <input type="number" id="ancho" class="form-input" placeholder="0.00" min="0" step="0.01">
                            <i class="fa-solid fa-table-cells input-icon"></i>
                        </div>
                        <div class="input-error-msg">Dato requerido</div>
                    </div>

                    <!-- Alto (Conditional) -->
                    <div class="input-group full-width" id="group-alto" style="display: none;">
                        <div class="label-row">
                            <label class="input-label" for="alto">Alto (m)</label>
                        </div>
                        <div class="input-wrapper">
                            <input type="number" id="alto" class="form-input" placeholder="0.00" min="0" step="0.01">
                            <i class="fa-solid fa-arrows-up-down input-icon"></i>
                        </div>
                        <div class="input-error-msg">Dato requerido para m³</div>
                    </div>
                </div>

                <!-- Add Button -->
                <div class="add-row">
                    <button class="btn-add" id="btn-add">
                        <i class="fa-solid fa-plus"></i> Agregar medida
                    </button>
                </div>

                <!-- Dynamic List -->
                <div id="items-list" class="items-list">
                    <!-- Items injected here via JS -->
                </div>
            </div>

            <!-- Right Column: Summary -->
            <div class="column-right">
                <!-- Main Calculate Button -->
                <div class="buttons-row">
                    <button class="btn btn-primary" id="btn-calc">
                        <i class="fa-solid fa-calculator"></i>
                        Calcular Total
                    </button>
                </div>

                <!-- Result -->
                <div id="result-area" class="result-container show">
                    <div class="result-label" id="res-label">TOTAL ACUMULADO (0 ITEMS)</div>
                    <div class="result-value" id="res-value">0.00 m²</div>
                </div>

                <!-- Auto Calculate Toggle -->
                <label class="auto-calc-toggle">
                    <input type="checkbox" id="auto-calc-checkbox" checked>
                    <span class="toggle-checkbox">
                        <i class="fa-solid fa-check"></i>
                    </span>
                    <span class="toggle-label">automático</span>
                </label>

                <!-- Footer -->
                <div class="card-footer">
                    <button class="btn-clear" id="btn-clear">Limpiar todo</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        /**
         * CALCULATOR APP
         * Features: State Management, LocalStorage Persistence, Precision Math, UX Enhancements
         */
        document.addEventListener('DOMContentLoaded', () => {
            // --- DOM Elements ---
            const dom = {
                largo: document.getElementById('largo'),
                ancho: document.getElementById('ancho'),
                alto: document.getElementById('alto'),
                groupAlto: document.getElementById('group-alto'),

                tabArea: document.getElementById('tab-area'),
                tabVolume: document.getElementById('tab-volume'),

                btnAdd: document.getElementById('btn-add'),
                btnCalc: document.getElementById('btn-calc'),
                btnClear: document.getElementById('btn-clear'),
                autoCalcCheckbox: document.getElementById('auto-calc-checkbox'),

                itemsList: document.getElementById('items-list'),
                resultArea: document.getElementById('result-area'),
                resLabel: document.getElementById('res-label'),
                resValue: document.getElementById('res-value')
            };

            // --- State Management ---
            // Single source of truth
            let state = {
                mode: 'area', // 'area' | 'volume'
                items: [],    // { id, mode, l, w, h, result, timestamp }
                autoCalc: true // Auto calculate on add/delete
            };

            const STORAGE_KEY = 'calc_app_v1';

            // --- Core Functions ---

            function init() {
                loadState();
                bindEvents();
                syncAutoCalcCheckbox(); // Sync checkbox with loaded state
                render(); // Initial render based on loaded state
                if (state.autoCalc) {
                    updateResultDisplay(); // Show initial totals if auto mode
                }
            }

            function loadState() {
                const stored = localStorage.getItem(STORAGE_KEY);
                if (stored) {
                    try {
                        const parsed = JSON.parse(stored);
                        // Validate basic structure to avoid crashes from stale data
                        if (parsed && Array.isArray(parsed.items)) {
                            state = { ...state, ...parsed };
                        }
                    } catch (e) {
                        console.error('Failed to load state', e);
                    }
                }
            }

            function saveState() {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
                render(); // Re-render whenever state changes to keep UI in sync
            }

            function setState(updates) {
                state = { ...state, ...updates };
                saveState();
            }

            // High precision rounding to prevent floating point errors (e.g. 300.000004)
            function preciseRound(num) {
                return Math.round((num + Number.EPSILON) * 100) / 100;
            }

            function generateId() {
                return Date.now().toString(36) + Math.random().toString(36).substr(2, 5);
            }

            // --- Logic Actions ---

            function switchMode(newMode) {
                if (state.mode === newMode) return;
                setState({ mode: newMode });
            }

            function addItem() {
                const { largo, ancho, alto } = dom;
                let isValid = true;

                // Validate
                if (!validateField(largo)) isValid = false;
                if (!validateField(ancho)) isValid = false;
                if (state.mode === 'volume' && !validateField(alto)) isValid = false;

                if (!isValid) return;

                const l = getVal(largo);
                const w = getVal(ancho);
                let h = 0;
                let result = 0;

                if (state.mode === 'area') {
                    result = l * w;
                } else {
                    h = getVal(alto);
                    result = l * w * h;
                }

                // Add to state
                const newItem = {
                    id: generateId(),
                    mode: state.mode,
                    l, w, h,
                    result: preciseRound(result),
                    timestamp: Date.now()
                };

                const newItems = [...state.items, newItem];
                setState({ items: newItems });

                // Reset Inputs
                largo.value = '';
                ancho.value = '';
                alto.value = '';
                clearErrors();
                dom.largo.focus(); // Good UX: focus back on first input

                // Auto calculate if enabled
                if (state.autoCalc) {
                    updateResultDisplay();
                }
            }

            function deleteItem(id) {
                const newItems = state.items.filter(i => i.id !== id);
                setState({ items: newItems });

                // Auto calculate if enabled
                if (state.autoCalc) {
                    updateResultDisplay();
                }
            }

            function clearAll() {
                setState({ items: [] });
                // Also clear inputs
                dom.largo.value = '';
                dom.ancho.value = '';
                dom.alto.value = '';
                clearErrors();
                dom.resultArea.classList.remove('show');
            }

            function calculateTotal() {
                // 1. Sum saved items (filtered by current mode)
                const relevantItems = state.items.filter(i => i.mode === state.mode);
                let total = relevantItems.reduce((sum, item) => sum + item.result, 0);

                // 2. Add current inputs if valid
                const { largo, ancho, alto } = dom;
                let currentVal = 0;

                // Only try to calculate input if at least one field has data
                const hasInput = largo.value || ancho.value || (state.mode === 'volume' && alto.value);

                if (hasInput) {
                    let isValid = true;
                    if (!validateField(largo)) isValid = false;
                    if (!validateField(ancho)) isValid = false;
                    if (state.mode === 'volume' && !validateField(alto)) isValid = false;

                    if (isValid) {
                        const l = getVal(largo);
                        const w = getVal(ancho);
                        if (state.mode === 'area') {
                            currentVal = l * w;
                        } else {
                            const h = getVal(alto);
                            currentVal = l * w * h;
                        }
                    } else {
                        // User has half-filled inputs that are invalid. Stop.
                        return;
                    }
                }

                const finalTotal = preciseRound(total + currentVal);
                showResultUI(finalTotal, relevantItems.length, hasInput);
            }

            // --- DOM & Rendering ---

            function render() {
                // 1. Update Tabs UI
                if (state.mode === 'area') {
                    dom.tabArea.classList.add('active');
                    dom.tabVolume.classList.remove('active');
                    dom.groupAlto.style.display = 'none';
                } else {
                    dom.tabVolume.classList.add('active');
                    dom.tabArea.classList.remove('active');
                    dom.groupAlto.style.display = 'flex';
                }

                // 2. Render List
                dom.itemsList.innerHTML = '';
                const visibleItems = state.items.filter(i => i.mode === state.mode);

                visibleItems.forEach((item, index) => {
                    const el = document.createElement('div');
                    el.className = 'list-item';

                    const unit = item.mode === 'area' ? 'm²' : 'm³';
                    const dimsText = item.mode === 'area'
                        ? `${item.l} x ${item.w} m`
                        : `${item.l} x ${item.w} x ${item.h} m`;

                    el.innerHTML = `
                        <div class="item-info">
                            <span class="item-title">Item ${index + 1}: <strong>${item.result.toFixed(2)} ${unit}</strong></span>
                            <span class="item-dims">${dimsText}</span>
                        </div>
                        <button class="btn-delete-item" aria-label="Eliminar item">
                            <i class="fa-solid fa-trash"></i>
                        </button>
                    `;

                    // Attach event directly to element reference
                    const deleteBtn = el.querySelector('.btn-delete-item');
                    deleteBtn.addEventListener('click', () => deleteItem(item.id));

                    dom.itemsList.appendChild(el);
                });
            }

            function showResultUI(value, infoCount, hasCurrentInput) {
                const unit = state.mode === 'area' ? 'm²' : 'm³';

                let labelText = `TOTAL ACUMULADO`;
                if (infoCount > 0 || hasCurrentInput) {
                    labelText += ` (${infoCount} ITEMS${hasCurrentInput ? ' + ACTUAL' : ''})`;
                } else {
                    labelText += ` (0 ITEMS)`;
                }

                dom.resLabel.textContent = labelText;
                dom.resValue.textContent = value.toFixed(2) + ' ' + unit;

                dom.resultArea.classList.remove('show');
                void dom.resultArea.offsetWidth; // Trigger reflow
                dom.resultArea.classList.add('show');
            }

            // Sync checkbox with state (for loaded state)
            function syncAutoCalcCheckbox() {
                dom.autoCalcCheckbox.checked = state.autoCalc;
            }

            // Update result display without considering current inputs (for auto mode)
            function updateResultDisplay() {
                const relevantItems = state.items.filter(i => i.mode === state.mode);
                const total = relevantItems.reduce((sum, item) => sum + item.result, 0);
                showResultUI(preciseRound(total), relevantItems.length, false);
            }

            // Toggle auto calculate mode
            function toggleAutoCalc() {
                const isChecked = dom.autoCalcCheckbox.checked;
                setState({ autoCalc: isChecked });

                // If just enabled, recalculate immediately
                if (isChecked) {
                    updateResultDisplay();
                }
            }

            // --- Input Validation Helpers ---

            function getVal(input) {
                return parseFloat(input.value);
            }

            function validateField(input) {
                const val = getVal(input);
                if (isNaN(val) || val <= 0) {
                    input.classList.add('error');
                    const group = input.closest('.input-group');
                    if (group) group.classList.add('error-state');
                    return false;
                }
                input.classList.remove('error');
                const group = input.closest('.input-group');
                if (group) group.classList.remove('error-state');
                return true;
            }

            function clearErrors() {
                [dom.largo, dom.ancho, dom.alto].forEach(inp => {
                    inp.classList.remove('error');
                    const group = inp.closest('.input-group');
                    if (group) group.classList.remove('error-state');
                });
            }

            // --- Event Bindings ---

            function bindEvents() {
                // Tabs
                dom.tabArea.addEventListener('click', () => switchMode('area'));
                dom.tabVolume.addEventListener('click', () => switchMode('volume'));

                // Actions
                dom.btnAdd.addEventListener('click', addItem);
                dom.btnCalc.addEventListener('click', calculateTotal);
                dom.btnClear.addEventListener('click', clearAll);

                // Auto calculate toggle
                dom.autoCalcCheckbox.addEventListener('change', toggleAutoCalc);

                // Input Handling (Enter key & Error clearing)
                const inputs = [dom.largo, dom.ancho, dom.alto];

                inputs.forEach(inp => {
                    // Remove error on type
                    inp.addEventListener('input', () => {
                        if (inp.value.length > 0) inp.classList.remove('error');
                        const group = inp.closest('.input-group');
                        if (group) group.classList.remove('error-state');
                    });

                    // Enter key to add
                    inp.addEventListener('keydown', (e) => {
                        if (e.key === 'Enter') {
                            e.preventDefault();
                            addItem();
                        }
                    });
                });

                // Delete key shortcut to clear all (only when not focused on input)
                document.addEventListener('keydown', (e) => {
                    if (e.key === 'Delete') {
                        // Safety: Don't trigger if user is typing in an input
                        if (document.activeElement.tagName === 'INPUT') {
                            return;
                        }

                        e.preventDefault();

                        // Show confirmation dialog
                        if (confirm('¿Borrar todo? Esta acción eliminará todas las medidas guardadas.')) {
                            clearAll();
                        }
                    }
                });
            }

            // Go!
            init();
        });
    </script>
</body>

</html>
