<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Informe Multi-Hoja — Glitch</title>
    <link rel="icon" href="https://res.cloudinary.com/dzhp64paw/image/upload/v1769010837/1_btdbv9.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Roboto+Mono:wght@400;500;600;700&family=DotGothic16&display=swap"
        rel="stylesheet">
    <style id="msheets-preview-overrides">
        /* Ajuste visual solo para msheets.html:
           1) Grilla de imagenes con marco A4 como Volanteo.
           2) Ocultar scrollbars internos en iframes de plantillas. */
        #root .msheets-a4-grid-preview {
            aspect-ratio: 210 / 297 !important;
            grid-auto-rows: minmax(0, 1fr) !important;
            align-content: stretch !important;
            overflow: hidden !important;
        }

        #root .msheets-a4-grid-preview>.msheets-grid-cell {
            aspect-ratio: auto !important;
            min-height: 0 !important;
        }

        #root iframe[title="Local Template Preview"] {
            overflow: hidden !important;
            scrollbar-width: none !important;
            -ms-overflow-style: none !important;
        }

        #root iframe[title="Local Template Preview"]::-webkit-scrollbar {
            width: 0 !important;
            height: 0 !important;
            display: none !important;
        }
    </style>
</head>

<body class="bg-neutral-950 text-neutral-200 min-h-screen">
    <div id="root"></div>
    <script>
        (() => {
            const GRID_PREVIEW_SELECTOR =
                '#root .bg-white.rounded-lg.shadow-md.overflow-hidden.border.border-neutral-200 .mt-2.grid.gap-1.p-1.bg-neutral-50.rounded.border.border-neutral-200';
            const LOCAL_IFRAME_SELECTOR = '#root iframe[title="Local Template Preview"]';

            const applyGridPreviewFix = () => {
                const gridPreviews = document.querySelectorAll(GRID_PREVIEW_SELECTOR);
                gridPreviews.forEach((grid) => {
                    grid.classList.add('msheets-a4-grid-preview');
                    Array.from(grid.children).forEach((cell) => {
                        if (!(cell instanceof HTMLElement)) return;
                        cell.classList.add('msheets-grid-cell');
                    });
                });
            };

            const applyIframeFix = (iframe) => {
                if (!(iframe instanceof HTMLIFrameElement)) return;
                if (iframe.dataset.msheetsNoScrollApplied === '1') return;
                iframe.dataset.msheetsNoScrollApplied = '1';
                iframe.setAttribute('scrolling', 'no');

                const injectNoScrollStyle = () => {
                    const doc = iframe.contentDocument;
                    if (!doc) return;
                    if (doc.getElementById('__msheets_iframe_noscroll__')) return;

                    const style = doc.createElement('style');
                    style.id = '__msheets_iframe_noscroll__';
                    style.textContent = `
                        html, body {
                            overflow: hidden !important;
                            scrollbar-width: none !important;
                            -ms-overflow-style: none !important;
                        }
                        html::-webkit-scrollbar,
                        body::-webkit-scrollbar {
                            width: 0 !important;
                            height: 0 !important;
                            display: none !important;
                        }
                    `;
                    (doc.head || doc.documentElement).appendChild(style);
                };

                iframe.addEventListener('load', injectNoScrollStyle);
                injectNoScrollStyle();
            };

            const applyAllPreviewFixes = () => {
                applyGridPreviewFix();
                document.querySelectorAll(LOCAL_IFRAME_SELECTOR).forEach((iframe) => applyIframeFix(iframe));
            };

            const boot = () => {
                const root = document.getElementById('root');
                if (!root) return;

                applyAllPreviewFixes();

                const observer = new MutationObserver(() => {
                    window.requestAnimationFrame(applyAllPreviewFixes);
                });

                observer.observe(root, {
                    childList: true,
                    subtree: true,
                });
            };

            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', boot, { once: true });
            } else {
                boot();
            }
        })();
    </script>
    <script type="module" src="/src/multi-sheet-report-main.jsx"></script>
</body>

</html>
