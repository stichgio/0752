project-includes = ["backend"]
project-excludes = [
  "**/__pycache__",
  "**/.pytest_cache",
  "**/node_modules",
]

# Make local backend modules importable from the workspace root.
search-path = ["backend", "typings"]

# Use the repo-local virtualenv for Pyrefly/Pyre2 when it is available.
python-interpreter-path = ".venv/Scripts/python.exe"
site-package-path = [
  ".venv/Lib/site-packages",
]
